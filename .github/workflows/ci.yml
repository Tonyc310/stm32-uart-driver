name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      RENODE_VERSION: 1.17.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
          pip install clang-format==23.1.2

      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.[ch] tests/unit/*.c

      - name: Unit tests (host)
        run: cmake --workflow --preset host-tests

      - name: Install Renode
        run: |
          curl -fsSL "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          renode_dir="$RUNNER_TEMP/renode_${RENODE_VERSION}-portable"
          pip install -r "$renode_dir/tests/requirements.txt"
          echo "$renode_dir" >> "$GITHUB_PATH"

      - name: Firmware build and Renode tests
        run: cmake --workflow --preset sim-tests

      - name: Upload Renode results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: renode-results
          path: build/firmware/renode/
